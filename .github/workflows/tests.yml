name: Java Tests

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Add your JUnit test below using this format:
      # - name: Run <feature name> JUnit tests
      #   run: mvn -B -Dtest=<TestClassName> test
      #
      # Example:
      # - name: Run Charlie AI Chat JUnit tests
      #   run: mvn -B -Dtest=ChatServiceTest test
      #
      #   Note: can also add more test script, separate them by commas
      #   run: mvn -B -Dtest=ChatServiceTest,DatabaseTest,WaterRecordTest test

      # DO NOT DELETE ANY EXISTING TESTS
      - name: Run database and authentication JUnit tests
        run: mvn -B -Dtest=WaterConsumptionServiceTest,HouseholdServiceTest,AuthServiceTest test

      # Charlie_Test/ -- grouped into two runs to keep the file tidy (18 classes total)
      - name: Run Charlie Test Suite (Part 1)
        run: mvn -B -Dtest=ChatDataContextBuilderMatchesScoreCalculatorTest,ChatDataContextBuilderReturnsNoDataBlockForUnknownUserTest,ConservationScoreCalculatorExposesAdjustmentAndPercentChangeTest,GenerationGuardRejectsConcurrentStartTest,HouseholdIdValidatorRejectsMalformedUuidTest,NonPositiveDurationSafetyTest,ShowerDurationWeightedAverageTest,SubtitleForScoreNegativeAdjustmentTest,SubtitleForScorePositiveAdjustmentTest test

      - name: Run Charlie Test Suite (Part 2)
        run: mvn -B -Dtest=SubtitleForScoreZeroRoundedAdjustmentTest,TipPhraserFallbackTest,UnauthorizedActionDetectorCatchesHouseholdIdTargetingTest,UnauthorizedActionDetectorCatchesOverrideScoreRewordingTest,UnauthorizedActionDetectorCatchesRawUuidForAnotherUserTest,UnauthorizedActionDetectorDoesNotFlagLegitimateQuestionsTest,UnauthorizedDataAccessRequestBypassesFiltersTest,UnauthorizedDataMutationRequestBypassesFiltersTest,UnauthorizedScoreMutationRequestBypassesFiltersTest test

      - name: Run Jainya Tests
        run: mvn -B -Dtest=SeasonalAggregationTest,WaterUsageStatsTest test

      - name: Run Jainya Tests
        run: mvn -B -Dtest=SeasonalAggregationTest,WaterUsageStatsTest test

      - name: Run leaderboard JUnit tests
        run: mvn -B -Dtest=LeaderBoardEntryTest test